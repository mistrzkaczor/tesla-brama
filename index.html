<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tesla SUPLA Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <header>

        <h1>🚗 TESLA SUPLA</h1>
        <p class="subtitle">Sterowanie bramą</p>

    </header>

    <main>

        <section class="status-card">

            <div id="statusIcon" class="status-icon">
                ⚪
            </div>

            <div id="statusText" class="status-text">
                Łączenie z SUPLA...
            </div>

            <div id="lastUpdate" class="status-update">
                Ostatnia aktualizacja: --
            </div>

        </section>

        <section class="buttons">

            <button id="btnOpen" class="btn btn-open">
                🟢 OTWÓRZ BRAMĘ
            </button>

            <button id="btnClose" class="btn btn-close">
                🔴 ZAMKNIJ BRAMĘ
            </button>

        </section>

    </main>

    <footer>

        <div id="message">
            Gotowy
        </div>

        <div class="version">
            Tesla SUPLA Dashboard v1.0
        </div>

    </footer>

</div>

<script src="config.js"></script>
<script src="app.js"></script>

</body>
</html>
