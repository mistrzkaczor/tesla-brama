<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TESLA - Brama</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <!-- ===========================
         BANER
    ============================ -->

    <header class="banner">

        <div class="tesla-title">
            T E S L A
        </div>

        <div class="tesla-line"></div>

        <div class="tesla-subtitle">
            Sterowanie bramą
        </div>

    </header>

    <!-- ===========================
         PRZYCISKI
    ============================ -->

    <main>

        <div class="buttons">

            <button
                id="btnOpen"
                class="btn btn-open">

                🟢 OTWÓRZ BRAMĘ

            </button>

            <button
                id="btnClose"
                class="btn btn-close">

                🔴 ZAMKNIJ BRAMĘ

            </button>

        </div>

    </main>

    <!-- ===========================
         STOPKA
    ============================ -->

    <footer>

        <div id="message">

            Gotowy

        </div>

    </footer>

</div>

<script src="config.js"></script>
<script src="app.js"></script>

</body>

</html>
