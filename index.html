<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tesla SUPLA Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <!-- ==========================================
                        HERO
    =========================================== -->

    <header class="hero">

        <div class="hero-title">

            T E S L A

        </div>

        <div class="hero-line"></div>

        <div class="hero-subtitle">

            Sterowanie bramą

        </div>

    </header>

    <!-- ==========================================
                      PRZYCISKI
    =========================================== -->

    <main class="actions">

        <!-- OTWÓRZ -->

        <button
            id="btnOpen"
            class="action action-open">

            <div class="action-icon">

                <img
                    src="img/gate-open.svg"
                    alt="Otwórz bramę">

            </div>

            <div class="action-title">

                OTWÓRZ BRAMĘ

            </div>

        </button>

        <!-- ZAMKNIJ -->

        <button
            id="btnClose"
            class="action action-close">

            <div class="action-icon">

                <img
                    src="img/gate-close.svg"
                    alt="Zamknij bramę">

            </div>

            <div class="action-title">

                ZAMKNIJ BRAMĘ

            </div>

        </button>

    </main>

    <!-- ==========================================
                        STATUS
    =========================================== -->

    <section class="status">

        <div class="status-line"></div>

        <div
            id="message"
            class="status-message">

            Gotowy

        </div>

        <div class="status-line"></div>

    </section>

    <!-- ==========================================
                        STOPKA
    =========================================== -->

    <footer>

        <span class="footer-name">

            Tesla SUPLA Dashboard

        </span>

        <span class="footer-separator">

            |

        </span>

        <span class="footer-version">

            v2.0

        </span>

    </footer>

</div>

<script src="config.js"></script>
<script src="app.js"></script>

</body>

</html>
