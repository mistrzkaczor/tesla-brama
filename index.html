<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>SUPLA </title>

    <meta
        name="theme-color"
        content="#111214">

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<div class="container">

    <!-- =========================================
                    TESLA
    ========================================== -->

    <header class="hero">

        <div class="hero-logo">

            T E S L A

        </div>

        <div class="hero-line"></div>

        <div class="hero-subtitle">

            Sterowanie bramą

        </div>

        <div class="hero-version">

            SUPLA

            <span>v3.2</span>

        </div>
    </header>

    <!-- =========================================
                PRZYCISKI
    ========================================== -->

    <main class="buttons">

        <!-- OTWÓRZ -->

        <button
            id="btnOpen"
            class="btn btn-open">

            <div class="btn-icon">

                <img
                    src="img/gate-open.svg"
                    alt="Open">

            </div>

            <div class="btn-text">

                OTWÓRZ BRAMĘ

            </div>

        </button>

        <!-- ZAMKNIJ -->

        <button
            id="btnClose"
            class="btn btn-close">

            <div class="btn-icon">

                <img
                    src="img/gate-close.svg"
                    alt="Close">

            </div>

            <div class="btn-text">

                ZAMKNIJ BRAMĘ

            </div>

        </button>

    </main>

    <!-- =========================================
                    STATUS
    ========================================== -->

    <section class="status">

        <div class="status-line"></div>

        <div
            id="message"
            class="status-text">

            🟢 Gotowy

        </div>

        <div class="status-line"></div>

    </section>

    <!-- =========================================
                    STOPKA
    ========================================== -->



</div>

<script src="config.js"></script>

<script src="app.js"></script>

</body>

</html>
