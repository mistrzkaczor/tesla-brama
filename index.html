<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Tesla SUPLA Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <!-- ==========================
            BANER
    =========================== -->

    <header class="hero">

        <div class="hero-car">

            <!-- tutaj później będzie SVG -->

        </div>

        <h1 class="hero-title">

            T E S L A

        </h1>

        <div class="hero-line"></div>

        <div class="hero-subtitle">

            Sterowanie bramą

        </div>

    </header>

    <!-- ==========================
            AKCJE
    =========================== -->

    <main>

        <button
            id="btnOpen"
            class="action action-open">

            <span class="action-icon">

                🟢

            </span>

            <span class="action-text">

                OTWÓRZ BRAMĘ

            </span>

        </button>


        <button
            id="btnClose"
            class="action action-close">

            <span class="action-icon">

                🔴

            </span>

            <span class="action-text">

                ZAMKNIJ BRAMĘ

            </span>

        </button>

    </main>

    <!-- ==========================
            STATUS
    =========================== -->

    <section class="status">

        <div class="status-line"></div>

        <div id="message">

            Gotowy

        </div>

        <div class="status-line"></div>

    </section>

    <!-- ==========================
            STOPKA
    =========================== -->

    <footer>

        <span class="footer-name">

            Tesla SUPLA Dashboard

        </span>

        <span class="footer-separator">

            |

        </span>

        <span class="footer-version">

            v2.0

        </span>

    </footer>

</div>

<script src="config.js"></script>
<script src="app.js"></script>

</body>

</html>
