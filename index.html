<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Tesla Gate</title>

    <!-- FAVICON -->
    <link rel="icon"
          type="image/svg+xml"
          href="img/favicon.svg">

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="container">

    <!-- =========================================
                    TESLA
    ========================================== -->

    <header class="hero">

<div class="hero-logo">
    T E S L A
</div>

<div class="hero-line"></div>

<div class="hero-subtitle">
    GATE DASHBOARD
</div>

        
<div class="hero-version">
    <span id="version"></span>
</div>

        
    </header>

    <!-- =========================================
                PRZYCISKI
    ========================================== -->

    <main class="buttons">

        <!-- OTWÓRZ -->

        <button
            id="btnOpen"
            class="btn btn-open">

            <div class="btn-icon">

                <img
                    src="img/gate-open.svg"
                    alt="Open">

            </div>

            <div class="btn-text">

                OTWÓRZ BRAMĘ

            </div>

        </button>

        <!-- ZAMKNIJ -->

        <button
            id="btnClose"
            class="btn btn-close">

            <div class="btn-icon">

                <img
                    src="img/gate-close.svg"
                    alt="Close">

            </div>

            <div class="btn-text">

                ZAMKNIJ BRAMĘ

            </div>

        </button>

    </main>

    <!-- =========================================
                    STATUS
    ========================================== -->

           <section class="status">
        <div class="status-line"></div>

        <div id="message" class="status-text">
            🟢 Gotowy
        </div>

        <div class="status-line"></div>
    </section>

</div>

    config.jsscript>
    <script src="app.js"></script>

</body>
</html>
