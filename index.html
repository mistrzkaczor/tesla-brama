<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Gate</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header class="hero">
        <div class="hero-logo">T E S L A</div>
        <div class="hero-line"></div>
        <div class="hero-subtitle">GATE DASHBOARD</div>
        <div class="hero-version">
            <span id="version"></span>
        </div>
    </header>

    <main class="buttons">
        <button id="btnOpen" class="btn btn-open">
            <div class="btn-icon">
                <img src="img/gate-open.svg" alt="Otwórz bramę">
            </div>
            <div class="btn-text">OTWÓRZ BRAMĘ</div>
        </button>

        <button id="btnClose" class="btn btn-close">
            <div class="btn-icon">
                <img src="img/gate-close.svg" alt="Zamknij bramę">
            </div>
            <div class="btn-text">ZAMKNIJ BRAMĘ</div>
        </button>
       </main>

    <section class="status">
        <div class="status-line"></div>

        <div class="status-content">
            <div id="message" class="status-text">
                🟢 Gotowy
            </div>

            <div id="lastRead" class="last-read">
                Ostatni odczyt: brak
            </div>
        </div>

        <div class="status-line"></div>
    </section>

</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
